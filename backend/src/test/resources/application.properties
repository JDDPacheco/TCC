spring.application.name=tcc

# Testes usam H2 em memória (modo MySQL): não dependem de um MySQL rodando e começam sempre com o banco vazio.
# O DataLoader roda normalmente e popula as tabelas de apoio.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:drStoreSysTeste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.error.include-message=always
